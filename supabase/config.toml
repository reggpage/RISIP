# Local Supabase config. Populated when you run `supabase init && supabase link --project-ref <ref>`.
project_id = "dsbplcqhlewxnivfwlcx"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://risip.online"
additional_redirect_urls = ["https://risip.online", "http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.batch-extract-receipts]
verify_jwt = true

[functions.extract-receipt]
verify_jwt = true

[functions.inbound-email]
verify_jwt = false

[functions.send-email]
verify_jwt = false

# Public Meta webhook: authenticated by the X-Hub-Signature-256 HMAC, not a JWT.
[functions.whatsapp-webhook]
verify_jwt = false

# Internal only — reached with the service-role key by the webhook or a sweeper.
[functions.whatsapp-worker]
verify_jwt = true
