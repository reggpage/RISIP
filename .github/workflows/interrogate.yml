# Two separate signals, deliberately.
#
#   test         — the gate. Unit suite + edge-function check. No secrets, no
#                  network, no production. Runs on every push and PR. A green
#                  check here means the code is sound. This is what must pass.
#
#   interrogate  — the monitor. Asks Risip thousands of questions built from the
#                  LIVE database and grades the answers. It needs production and
#                  the service-role key, so it runs on a schedule (and on
#                  demand), never on a pull request from a fork, and it is
#                  allowed to no-op when the secrets are absent rather than
#                  failing loudly.
#
# WHY THEY ARE SPLIT. The interrogation was gating every push against
# production. A brief network hiccup or a missing secret then turned into "All
# jobs have failed", which is noise, not signal — the code was fine. The gate
# must depend only on the repo; the monitor may depend on the world.
#
# SECRETS for the monitor (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                 https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    service_role key — never in the repo, never in
#                                a VITE_ variable, never printed by this job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 04:00 UTC = 07:00 in Dar es Salaam, before the shops open.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Interrogation seeds (each asks --count questions)'
        default: '10'
      count:
        description: 'Questions per seed'
        default: '240'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The gate. Everything the repo can prove about itself, and nothing else. ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Edge functions boot-safe
        run: npx vite-node scripts/check-edge-functions.ts

  # ── The monitor. Needs production; never gates a push; skips without secrets. ─
  interrogate:
    # Not on pull_request: a fork PR has no secrets, and this must not appear to
    # fail there. Scheduled, manual, or a push to main only.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Interrogate the live shop
        id: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set — skipping the interrogation."
            echo "summary=skipped (no secrets)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx vite-node scripts/interrogate.ts \
            --seeds "${{ inputs.seeds || '10' }}" \
            --count "${{ inputs.count || '240' }}" \
            | tee interrogation.log
          echo "summary=$(grep -m1 'Current Capability Score' interrogation.log || echo 'no score line')" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ${{ steps.run.outputs.summary || 'Interrogation did not finish' }}"
            echo
            echo '```'
            tail -n 60 interrogation.log 2>/dev/null || echo 'no log (skipped or failed before output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report and the trend line
        if: github.event_name == 'schedule' && steps.run.outputs.summary != 'skipped (no secrets)'
        run: |
          git config user.name 'risip-interrogator'
          git config user.email 'noreply@risip.online'
          git add docs/ai-interrogation.md docs/interrogation-history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
          else
            git commit -m "Interrogation: ${{ steps.run.outputs.summary }}"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interrogation
          path: |
            interrogation.log
            docs/ai-interrogation.md
          retention-days: 30
          if-no-files-found: ignore
