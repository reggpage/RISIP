# Ask Risip 2,400 questions every morning, and say plainly how it did.
#
# WHY A GITHUB ACTION AND NOT A SUPABASE CRON
#
# The interrogation is not a database job. It imports the same TypeScript the
# edge functions import — the routing chain, the parsers, the reply builders —
# and asserts against arithmetic done separately in the same process. A Supabase
# scheduled function would have to reimplement all of that inside Deno, and a
# second implementation is exactly the thing that drifts and stops meaning
# anything. Here it runs against the checked-out repo, so it is always testing
# the code that is actually committed.
#
# It reads production and writes nothing: selects and read-only RPCs only.
#
# SECRETS (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                 https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    service_role key — never in the repo, never in
#                                a VITE_ variable, never printed by this job
#
# The service-role key bypasses RLS. It is here because the harness has to read
# every company's shape the way the webhook does; it is passed as an env var to
# one step and appears in no log line.

name: Interrogate

on:
  schedule:
    # 04:00 UTC = 07:00 in Dar es Salaam, before the shops open, so a regression
    # is found before anybody is relying on the answer.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many seeds (each asks --count questions)'
        default: '10'
      count:
        description: 'Questions per seed'
        default: '240'
  pull_request:
    # A change to the language pipeline is exactly when this matters most.
    paths:
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/whatsapp-webhook/**'
      - 'scripts/interrogate.ts'
      - 'scripts/lib/**'

concurrency:
  group: interrogate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interrogate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The unit suite first. If the parsers are broken here, the interrogation
      # score would only be measuring the breakage twice.
      - name: Unit tests
        run: npm test

      - name: Interrogate
        id: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx vite-node scripts/interrogate.ts \
            --seeds "${{ inputs.seeds || '10' }}" \
            --count "${{ inputs.count || '240' }}" \
            | tee interrogation.log
          # The one line worth carrying forward. `set -o pipefail` is on by
          # default in this shell, so a Grade F has already failed the step.
          echo "summary=$(grep -m1 'Current Capability Score' interrogation.log)" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ${{ steps.run.outputs.summary || 'Interrogation did not finish' }}"
            echo
            echo '```'
            tail -n 60 interrogation.log 2>/dev/null || echo 'no log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report and the trend line
        if: github.event_name == 'schedule' && success()
        run: |
          git config user.name 'risip-interrogator'
          git config user.email 'noreply@risip.online'
          git add docs/ai-interrogation.md docs/interrogation-history.json
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
          else
            git commit -m "Interrogation: ${{ steps.run.outputs.summary }}"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interrogation
          path: |
            interrogation.log
            docs/ai-interrogation.md
          retention-days: 30
