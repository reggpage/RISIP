  # ══════════════════════════════════════════════════════════════════════════
  # STAGE D — the model is a brain, not a printer.
  #
  # Every case here comes from a real production message, and each one failed
  # because something in the codebase was answering FOR the model: a mandatory
  # three-section adviser template, a tool description that said "follow it
  # exactly", a summary tool whose examples overlapped the adviser's, or a
  # rendered sentence returned as terminalReply so the model never got to think.
  #
  # expect_metric is new. Tool choice alone cannot tell these apart: asking what
  # a product SOLD FOR and asking HOW MANY it sold are the same tool and
  # different questions, and answering one with the other is how "Nguvu ya Sala
  # ina mauzo ya shingapi" came back as "62 vipande".
  # ══════════════════════════════════════════════════════════════════════════

