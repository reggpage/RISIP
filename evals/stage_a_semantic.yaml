# STAGE A — semantic labels, and the categories the existing 240 cases do not cover.
#
# These are TESTS, not parser rules. When a case here fails, the fix is to the
# capability, the tool contract or the prompt that made a whole CATEGORY fail —
# never a regex for this one sentence. That distinction is the entire reason
# Stage A exists: "shingapi" failed three times and was fixed as one phrase, and
# the next unlisted phrasing failed the same way a day later.
#
# THE EXTENDED CONTRACT
#
#   say:                     the message, exactly as a trader would type it
#   expect_intent:           semantic intent from whatsappTelemetry.ts
#   expect_tool:             which tool should be called (null = none may be)
#   expect_lines:            product/quantity/unit WORDING the model should carry
#   expect_party:            customer or supplier wording
#   expect_payment_wording:  the payment word the trader used, verbatim
#   expect_price_band_wording: jumla / rejareja, verbatim
#   expect_occurred_at_wording: jana / wiki iliyopita, verbatim
#   expect_clarification:    which field the backend must ask for
#   backend_should:          accept | clarify | reject
#
# Not every field appears in every case. Absent means unasserted, never
# "expected empty".

